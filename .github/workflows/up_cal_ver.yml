name: Bump CalVer and Commit

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

concurrency:
  group: calver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-and-commit:
    if: github.ref_name != 'master' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Compute CalVer, update VERSION + Cargo.toml, commit & push
        run: |
          set -euo pipefail

          git pull --rebase origin "${{ github.ref_name }}" || true

          CURRENT_VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0")
          echo "Current version: $CURRENT_VERSION"

          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)

          CUR_YEAR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          CUR_MONTH=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          CUR_PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          if [[ "$YEAR" != "$CUR_YEAR" || "$MONTH" != "$CUR_MONTH" ]]; then
            NEW_VERSION="$YEAR.$MONTH.0"
          else
            NEW_PATCH=$((CUR_PATCH + 1))
            NEW_VERSION="$YEAR.$MONTH.$NEW_PATCH"
          fi

          echo "New version: $NEW_VERSION"
          echo "$NEW_VERSION" > VERSION

          ( cd src-tauri && cargo set-version "$NEW_VERSION" )

          if [[ -z $(git status --porcelain) ]]; then
            echo "No version changes to commit."
            exit 0
          fi

          git add VERSION
          git add -A -- '*Cargo.toml' '*Cargo.lock' 2>/dev/null || true

          git commit -m "chore(version): bump CalVer version to $NEW_VERSION"
          git push origin "HEAD:${{ github.ref_name }}"
